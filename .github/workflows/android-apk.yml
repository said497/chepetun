name: Construir APK de ChepeTun

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Instalar herramientas Android
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -L https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Aceptar licencias Android
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses || true

      - name: Instalar SDK Android 35
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Descomprimir proyecto
        run: |
          mkdir -p source
          unzip -q ChepeTun-descarga.zip -d source
        - name: Alinear Java y Kotlin
          run: |
            python3 - <<'PY'
            from pathlib import Path
            p = Path("source/app/build.gradle.kts")
            s = p.read_text()
            if "sourceCompatibility = JavaVersion.VERSION_17" not in s:
                i = s.index("\ndependencies {")
                j = s.rfind("\n}", 0, i)
                s = s[:j] + """
                compileOptions {
                    sourceCompatibility = JavaVersion.VERSION_17
                    targetCompatibility = JavaVersion.VERSION_17
                }
            """ + s[j:]
            if 'jvmTarget = "17"' not in s:
                s += '''

            tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
                kotlinOptions {
                    jvmTarget = "17"
                }
            }
            '''
            p.write_text(s)
            PY
      - name: Compilar APK
        run: |
          gradle -p source --no-daemon assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: ChepeTun-debug-apk
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
