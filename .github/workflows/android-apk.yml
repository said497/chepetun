
name: Construir APK de ChepeTun

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Aceptar licencias Android
        run: yes | sdkmanager --licenses || true

      - name: Instalar Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Descomprimir proyecto
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir source
          unzip -q ChepeTun-descarga.zip -d source

      - name: Corregir configuración Java y Kotlin
        run: |
          cat > source/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.chepetun.app"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.chepetun.app"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 3
                  versionName = "0.3.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("com.github.mwiede:jsch:0.2.20")
              implementation("androidx.security:security-crypto:1.1.0-alpha06")
          }
          EOF

      - name: Compilar APK
        run: gradle -p source --no-daemon assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: ChepeTun-debug-apk
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
